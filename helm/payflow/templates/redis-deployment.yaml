apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payflow.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "payflow.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "payflow.name" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "payflow.name" . }}-redis
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}

          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
