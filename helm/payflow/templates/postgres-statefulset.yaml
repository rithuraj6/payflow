apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "payflow.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "payflow.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  serviceName: {{ include "payflow.fullname" . }}-postgres
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "payflow.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "payflow.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}

          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}

          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}

            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "payflow.fullname" . }}-secret
                  key: DATABASE_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.username }}
                - -d
                - {{ .Values.postgres.database }}
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.username }}
                - -d
                - {{ .Values.postgres.database }}
            initialDelaySeconds: 30
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
